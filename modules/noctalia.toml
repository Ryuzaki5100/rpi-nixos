# Noctalia v5 starter configuration for the Raspberry Pi 5 desktop.
# Copy to ~/.config/noctalia/config.toml (seeded automatically on first boot).
# Full reference: https://docs.noctalia.dev/v5/

[accessibility]
ui_scale              = 1.0
high_contrast         = false

[shell]
corner_radius_scale   = 1.0
font_family           = "sans-serif"
time_format           = "{:%H:%M}"
date_format           = "%A, %x"
polkit_agent          = true
show_location         = false
clipboard_enabled     = true
telemetry_enabled     = false

[shell.animation]
enabled = true
speed   = 1.0

[shell.panel]
transparency_mode     = "soft"
borders               = true
shadow                = true
launcher_placement    = "floating"
clipboard_placement   = "floating"
control_center_placement = "attached"
wallpaper_placement   = "attached"
session_placement     = "attached"

[shell.launcher]
categories    = true
show_icons    = true
sort_by_usage = true
pinned        = [ "foot", "firefox" ]

[wallpaper]
enabled             = true
fill_mode           = "crop"
transition          = [ "fade" ]
directory           = "~/Pictures/Wallpapers"

[theme]
mode   = "dark"
source = "builtin"
builtin = "Noctalia"
pure_black_dark = false

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "top"
scale              = 1.0
background_opacity = 0.97

[osd]
position = "top_center"
scale = 1.0

[lockscreen]
enabled          = true
blurred_desktop  = false
blur_intensity   = 0.5
tint_intensity   = 0.3

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

[audio]
enable_sounds = true
sound_volume  = 0.6

[brightness]
enable_ddcutil = false

[nightlight]
enabled = false

[bar.main]
position           = "top"
thickness          = 34
background_opacity = 1.0
radius             = 12
margin_ends        = 180
margin_edge        = 10
padding            = 14
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
reserve_space      = true
start  = [ "launcher", "workspaces" ]
center = [ "clock" ]
end    = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]

[dock]
enabled = false