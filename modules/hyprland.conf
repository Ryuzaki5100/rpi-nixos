# Hyprland starter config for the Raspberry Pi 5 desktop (seeded on first boot).
# Note: Noctalia is the shell/bar; Hyprland is the compositor underneath it.

monitor = , preferred, auto, 1

# Rules
general {
  gaps_in = 6
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(89caebee) rgba(81a1f1ee) 45deg
  col.inactive_border = rgba(2e3440cc)
  layout = master
}

decoration {
  rounding = 8
  blur {
    enabled = true
    size = 5
    passes = 2
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = yes
  bezier = easeOutCubic, 0.18, 0.67, 0.36, 1.0
  animation = windows, 1, 5, easeOutCubic
  animation = fade, 1, 4, easeOutCubic
  animation = workspaces, 1, 5, easeOutCubic
}

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = false
  }
}

misc {
  disable_hyprland_logo = true
}

# Bindings
bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, Space, exec, noctalia msg panel-toggle launcher
bind = SUPER, V, exec, noctalia msg panel-toggle clipboard
bind = SUPER, N, exec, noctalia msg panel-toggle control-center
bind = SUPER, L, exec, noctalia msg session lock

# Workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bind = SUPER, F, fullscreen
bind = SUPER, C, exec, wl-copy --clear